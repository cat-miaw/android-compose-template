# --- JVM / build speed -------------------------------------------------------
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn

# --- Kotlin ------------------------------------------------------------------
# Strong skipping is default-on in Kotlin 2.0.20+. Explicit for clarity.
kotlin.code.style=official
kotlin.incremental=true

# --- Android -----------------------------------------------------------------
# Only package resources you actually use; keeps the APK small.
android.nonTransitiveRClass=true
android.nonFinalResIds=true
android.defaults.buildfeatures.buildconfig=false
android.defaults.buildfeatures.resvalues=false
android.defaults.buildfeatures.shaders=false

# --- Compose -----------------------------------------------------------------
# Smaller, faster R8 output for Compose.
android.enableR8.fullMode=true